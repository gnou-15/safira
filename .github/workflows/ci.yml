name: Continuous Integration (CI) Pipeline

on:
  push:
    branches: [ main, 'feature/*', 'fix/*' ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend Validation (React + Vite)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend (Production Bundle)
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # Node.js API Gateway Validation (Express)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-node-ci:
    name: Backend Node.js (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend-node/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Validate Node.js Syntax & Server Entrypoint
        run: node --check server.js controllers/healthController.js

  # ─────────────────────────────────────────────────────────────────────────────
  # Python AI Service Validation (FastAPI)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-python-ci:
    name: Backend Python (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './backend-python/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Compilation
        run: python -m py_compile app.py prompt_guard.py response_validator.py ingest.py embeddings.py

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker Image Build Verification
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Node Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-node
          push: false
          tags: safira-backend-node:test

      - name: Build Python Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-python
          push: false
          tags: safira-backend-python:test

  # ─────────────────────────────────────────────────────────────────────────────
  # Dependency Security Scanning
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      - name: Audit Node Backend Dependencies
        working-directory: ./backend-node
        run: npm audit --audit-level=high || true

      - name: Setup Python & Audit Python Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Pip Audit
        run: |
          python -m pip install pip-audit
          pip-audit -r backend-python/requirements.txt || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Quality Gate Aggregator
  # ─────────────────────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Pipeline Quality Gate
    needs: [frontend-ci, backend-node-ci, backend-python-ci, docker-build, security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify All Parallel Jobs Passed
        run: |
          if [ "${{ needs.frontend-ci.result }}" != "success" ] || \
             [ "${{ needs.backend-node-ci.result }}" != "success" ] || \
             [ "${{ needs.backend-python-ci.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "❌ One or more CI jobs failed!"
            exit 1
          fi
          echo "✅ All CI parallel jobs passed successfully!"
